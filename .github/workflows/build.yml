name: Build APK

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Cordova
    run: npm install -g cordova

  - name: Create Cordova project
    run: |
      cordova create app com.yourcompany.fioriapp FioriApp
      rm -rf app/www/*
      cp -r webapp/* app/www/

  - name: Configure Cordova
    working-directory: app
    run: |
      sed -i 's#</widget>#<allow-navigation href="http://ashd2sap.exalca.corp:8000/*" />\n<allow-navigation href="https://sapui5.hana.ondemand.com/*" />\n<allow-navigation href="https://cdnjs.cloudflare.com/*" />\n<access origin="*" />\n<edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application"><application android:usesCleartextTraffic="true" /></edit-config>\n</widget>#' config.xml

  - name: Add Android platform
    working-directory: app
    run: |
      cordova platform add android

  - name: Build APK
    working-directory: app
    run: |
      cordova build android

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: app-apk
      path: app/platforms/android/app/build/outputs/apk/debug/*.apk
```
