name: Build APK

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Cordova
    run: npm install -g cordova

  - name: Create Cordova project
    run: |
      cordova create app com.yourcompany.fioriapp FioriApp
      rm -rf app/www/*
      cp -r webapp/* app/www/

  - name: Configure Cordova
    run: |
      cd app

      python3 -c "from pathlib import Path; p=Path('config.xml'); s=p.read_text(); s=s.replace('</widget>', '''<allow-navigation href=\"*\" />
      <access origin=\"*\" />
      <allow-intent href=\"http://*/*\" />
      <allow-intent href=\"https://*/*\" />
      </widget>'''); p.write_text(s)"

  - name: Add Android platform
    working-directory: app
    run: cordova platform add android

  - name: Build APK
    working-directory: app
    run: cordova build android

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: app-apk
      path: app/platforms/android/app/build/outputs/apk/debug/*.apk
